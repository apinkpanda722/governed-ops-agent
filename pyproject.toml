[project]
name = "govops"
version = "0.1.0"
description = "사용자 신원으로 운영 업무를 수행하는 에이전트와 거버넌스 게이트웨이"
readme = "README.md"
authors = [
    { name = "SpanLee-Time", email = "iih907@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
]

[tool.ruff]
extend-exclude = ["phases", "scripts", "web"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]
