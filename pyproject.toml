[project]
name = "govops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SpanLee-Time", email = "iih907@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
govops = "govops:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
]
