[project]
name = "govops"
version = "0.1.0"
description = "사용자 신원으로 운영 업무를 수행하는 에이전트와 거버넌스 게이트웨이"
readme = "README.md"
authors = [
    { name = "SpanLee-Time", email = "iih907@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "langfuse>=4.16.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mcp>=2.3.0",
    "openai>=3.24.0",
    "psycopg[binary,pool]>=3.3.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "filelock>=4.0.12",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
]

[tool.ruff]
extend-exclude = ["phases", "scripts", "web"]

[tool.ruff.lint.isort]
# src 레이아웃 탐지가 환경에 따라 달라지지 않도록 고정한다.
known-first-party = ["govops"]

[tool.pytest.ini_options]
addopts = "-n auto"
testpaths = ["tests", "scripts"]
