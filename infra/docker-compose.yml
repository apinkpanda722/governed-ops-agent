name: govops

services:
  postgres:
    # 공식 릴리스·보안 공지 확인(2026-10-04): PostgreSQL 17.11 보안 수정 28건 포함, Langfuse 공식 compose 기본 17 계열
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    # 공식 릴리스·보안 공지 확인(2026-10-04): 1.103 안정 라인 핫픽스, CVE-2026-42208·48710·35030 수정 포함, pull 시 cosign 서명 검증
    image: ghcr.io/berriai/litellm:v1.103.3
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_DATABASE_URL: ${LITELLM_DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  mock-jira:
    build:
      context: ..
      dockerfile: infra/mocks/Dockerfile
    command: ["python", "-m", "govops.mocks", "jira"]
    volumes:
      - ../data/seed:/app/data/seed:ro
    ports:
      - "127.0.0.1:8081:8000"
    # 관리 접근: docker compose exec mock-jira python -m govops.mocks.admin health
    expose: ["9000"]

  mock-slack:
    build:
      context: ..
      dockerfile: infra/mocks/Dockerfile
    command: ["python", "-m", "govops.mocks", "slack"]
    ports:
      - "127.0.0.1:8082:8000"
    # 관리 접근: docker compose exec mock-slack python -m govops.mocks.admin health
    expose: ["9000"]

  # Langfuse v3 구성 참고: https://github.com/langfuse/langfuse/blob/main/docker-compose.yml
  # 확인 필요(구현 시 공식 문서로 확인): v3 환경 변수 이름·버킷 초기화·태그별 호환성.
  # 최신 공식 compose와 v3의 차이는 첫 기동 전에 사용자가 확인한다.
  langfuse-worker:
    profiles: ["obs"]
    # 공식 릴리스·보안 공지 확인(2026-10-04): Langfuse v3 라인 최신(2026-09-24)
    image: langfuse/langfuse-worker:3.225.11
    environment: &langfuse-environment
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: http://127.0.0.1:3000
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH}
      # 확인 필요(구현 시 공식 문서로 확인): 이벤트 업로드에 필요한 S3 변수·버킷.
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
    depends_on: &langfuse-dependencies
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  langfuse-web:
    profiles: ["obs"]
    # 공식 릴리스·보안 공지 확인(2026-10-04): Langfuse v3 라인 최신(2026-09-24)
    image: langfuse/langfuse:3.225.11
    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: *langfuse-dependencies

  clickhouse:
    profiles: ["obs"]
    # 공식 릴리스·보안 공지 확인(2026-10-04): Langfuse v3 호환, v4 최소 요구 25.12 충족
    image: clickhouse/clickhouse-server:25.12.9.61
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["obs"]
    # 공식 릴리스·보안 공지 확인(2026-10-04): 7.4.11 보안 수정 포함, 이후 보안 수정은 M2 obs 첫 기동 전 재확인
    image: redis:7.4.11
    command: ["redis-server", "--requirepass", "${REDIS_AUTH}", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_AUTH}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    profiles: ["obs"]
    # 공식 릴리스·보안 공지 확인(2026-10-04): MinIO 공식 이미지 배포 중단, Langfuse 공식 compose의 Chainguard 이미지를 digest로 고정(무료판은 latest만 제공)
    image: cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    entrypoint: ["/bin/sh", "-c"]
    # 확인 필요(구현 시 공식 문서로 확인): /data/langfuse 생성 방식의 버킷 초기화 지원.
    command: ['mkdir -p /data/langfuse && exec minio server --address ":9000" --console-address ":9001" /data']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  redis_data:
  minio_data:
