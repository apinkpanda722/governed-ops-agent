model_list:
  - model_name: agent-primary
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
      timeout: 15
      num_retries: 0
  - model_name: agent-fallback
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 30
      num_retries: 0
  - model_name: agent-primary-only
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
      timeout: 15
      num_retries: 0
  - model_name: agent-primary-down
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
      api_base: http://127.0.0.1:9
      timeout: 15
      num_retries: 0

router_settings:
  fallbacks:
    - agent-primary: [agent-fallback]
    - agent-primary-down: [agent-fallback]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL

# Guardrail 훅 자리: Guardrail은 M4

# 프롬프트·응답 원문은 obs 마스킹을 거치지 않으므로 끈다(요청·답변은 에이전트 span이 PII 마스킹 후 보낸다).
# 끄면 LiteLLM은 내용을 비우지 않고 messages·응답 내용을 `redacted-by-litellm` 자리 표시자로 바꿔 보낸다.
# 이 파일은 바인드 마운트라 내용만 바꾸면 compose가 재생성하지 않으므로 `make obs-up`이 litellm을 항상 재생성한다.
litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  turn_off_message_logging: true
