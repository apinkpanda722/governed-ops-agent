model_list:
  - model_name: agent-primary
    model_info:
      id: openai-gpt-6-luna
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
      timeout: 15
      num_retries: 0
  - model_name: agent-fallback
    model_info:
      id: anthropic-claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 30
      num_retries: 0
  - model_name: agent-primary-only
    model_info:
      id: openai-gpt-6-luna-only
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
      timeout: 15
      num_retries: 0
  - model_name: agent-primary-down
    model_info:
      id: openai-gpt-6-luna-down
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
      api_base: http://127.0.0.1:9
      timeout: 15
      num_retries: 0

router_settings:
  fallbacks:
    - agent-primary: [agent-fallback]
    - agent-primary-down: [agent-fallback]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL

guardrails:
  - guardrail_name: govops-pre
    litellm_params:
      guardrail: govops.gateway.guardrail_hook.GovopsGuardrail
      mode: pre_call
      default_on: true
  - guardrail_name: govops-post
    litellm_params:
      guardrail: govops.gateway.guardrail_hook.GovopsGuardrail
      mode: post_call
      default_on: true
