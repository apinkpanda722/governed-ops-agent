# 프로젝트 레벨 Codex hook 설정. 실제 스크립트는 scripts/hooks/ 에 있고
# Claude Code용 .claude/settings.json 도 같은 스크립트를 가리킨다.

[[hooks.PreToolUse]]
matcher = "Bash"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/scripts/hooks/dangerous-command-guard.sh"'
timeout = 5
statusMessage = "위험한 명령어 검사 중"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/scripts/hooks/verify-before-stop.sh"'
timeout = 600
statusMessage = "make verify 실행 중"
